name: Validate

on:
  workflow_dispatch:
  schedule:
    # Weekly is enough to notice a change in hassfest or the HACS action between pull requests.
    - cron: "0 0 * * 1"
  pull_request:
    branches:
      - main
    # A draft spends no minutes; marking it ready for review runs everything.
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  hassfest: # https://contributors.home-assistant.io/blog/2020/04/16/hassfest/
    name: Hassfest validation
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  hacs: # https://github.com/hacs/action
    name: HACS validation
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect brand images
        id: brand
        run: |
          if compgen -G "custom_components/*/brand/icon.png" >/dev/null; then
            echo "ignore=" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::No custom_components/<domain>/brand/icon.png - skipping the brands check the Marketplace catalog requires"
            echo "ignore=brands" >>"$GITHUB_OUTPUT"
          fi

      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: ${{ steps.brand.outputs.ignore }}
