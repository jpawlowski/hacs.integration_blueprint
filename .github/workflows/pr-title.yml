---
# A squash merge turns the pull request's title into the commit on main, a rebase merge keeps each of its commits, and
# release-please reads either for the version and the changelog. The rules come from the base branch, so a pull request
# cannot loosen them for itself.

name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    # A body edit leaves the title as it was; only a title edit needs the check again.
    if: ${{ !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.title != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the commitlint configuration from the base branch
    steps:
      - name: Checkout the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check the title against the commit message rules
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          printf '%s\n' "${TITLE}" | npx --no-install commitlint --verbose

      # Not required: a pull request meant for squashing may carry working commits. Rebase-merge only when this passes.
      - name: Check each commit, for a rebase merge
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --quiet --no-tags origin "pull/${NUMBER}/head"
          if ! npx --no-install commitlint --from "$(git merge-base "${BASE}" FETCH_HEAD)" --to FETCH_HEAD --verbose; then
            echo "::warning::Some commits do not follow the commit message rules — squash this pull request, do not rebase it"
            exit 1
          fi
